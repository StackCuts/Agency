<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Master Social & LinkedIn Thumbnail (16:9 - 1280x720)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background-color: #F8F9FB;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Main Canvas */
    .banner {
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 18% 50%, rgba(234, 167, 121, 0.12) 0%, transparent 48%),
                  radial-gradient(circle at 82% 35%, rgba(59, 130, 246, 0.12) 0%, transparent 48%),
                  #F8F9FB;
      display: grid;
      grid-template-columns: 480px 1fr;
      align-items: center;
      padding: 70px 90px;
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    /* ========================================================================= */
    /* LEFT: High-Impact Portrait Badge                                          */
    /* ========================================================================= */
    .portrait-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .portrait-box {
      position: relative;
      width: 380px;
      height: 380px;
    }

    /* Bold Orange Arc */
    .orange-arc {
      position: absolute;
      top: -14px;
      left: -14px;
      width: 175px;
      height: 175px;
      border-radius: 50%;
      border: 5px solid #EAA779;
      border-right-color: transparent;
      border-bottom-color: transparent;
      transform: rotate(-12deg);
      z-index: 1;
    }

    /* Soft Blue Pill */
    .blue-pill {
      position: absolute;
      bottom: -8px;
      right: -8px;
      width: 58px;
      height: 16px;
      border-radius: 9999px;
      background-color: #BAE6FD;
      transform: rotate(-28deg);
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
      z-index: 1;
    }

    /* Main Circular Frame */
    .portrait-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(147, 197, 253, 0.4), rgba(199, 210, 254, 0.45), rgba(226, 232, 240, 0.5));
      border: 6px solid #FFFFFF;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transform: scale(1.06) translateY(12px);
    }

    /* Floating Status Badge (DTC Creative Strategist) */
    .status-badge {
      position: absolute;
      bottom: -18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 24px;
      border-radius: 9999px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0F172A;
      z-index: 5;
      white-space: nowrap;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25);
    }

    /* ========================================================================= */
    /* RIGHT: Vertically Centered Brand Identity, Headline & Hand-Drawn Doodle   */
    /* ========================================================================= */
    .content-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 48px;
      position: relative;
    }

    /* Brand Logo (Akaya Kanadaka) */
    .logo-container {
      position: relative;
      display: inline-block;
      width: fit-content;
      margin-bottom: 24px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-text {
      font-family: 'Akaya Kanadaka', cursive;
      font-size: 52px;
      color: #0F172A;
      line-height: 1;
    }

    .logo-divider {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 300;
      color: #94A3B8;
      margin: 0 6px;
      font-size: 38px;
    }

    .inline-sparkle {
      color: #EAA779;
      font-size: 26px;
      margin-left: 4px;
    }

    .blue-brush {
      width: 100%;
      height: 15px;
      color: #3B82F6;
      margin-top: -2px;
      display: block;
    }

    /* Main Headline (Fraunces Serif) */
    .headline {
      font-family: 'Fraunces', serif;
      font-size: 56px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 28px;
      position: relative;
    }

    .red-scribble-wrapper {
      display: inline-block;
      position: relative;
    }

    .red-scribble {
      position: absolute;
      left: 0;
      bottom: -10px;
      width: 100%;
      height: 16px;
      color: #E11D48;
      pointer-events: none;
    }

    /* Open Doodle Arrow & Note (Generous Space, Zero Overlap) */
    .doodle-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 6px;
    }

    .arrow-svg {
      width: 64px;
      height: 64px;
      color: #EAA779;
      transform: rotate(-10deg);
    }

    .doodle-text-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .arrow-label {
      font-family: 'Akaya Kanadaka', cursive;
      font-size: 26px;
      color: #EAA779;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .doodle-sparkle {
      color: #EAA779;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="banner">
    
    <!-- LEFT: High-Impact Portrait Badge -->
    <div class="portrait-col">
      <div class="portrait-box">
        <div class="orange-arc"></div>
        <div class="blue-pill"></div>
        <div class="portrait-frame">
          <img src="/mayur_portrait.png" alt="Mayur Portrait">
        </div>
        <div class="status-badge">
          <div class="pulse-dot"></div>
          <span>DTC Creative Strategist</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Centered Content Column -->
    <div class="content-col">
      
      <!-- Brand Logo with Inline Sparkle and Blue Brush Stroke -->
      <div class="logo-container">
        <div class="logo-row">
          <div class="logo-text">
            Mayur <span class="logo-divider">//</span> StackCuts
          </div>
          <span class="inline-sparkle">✦</span>
        </div>
        <svg class="blue-brush" viewBox="0 0 130 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9.5C38 4.5 90 4 127 8.5" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Main Headline with Red Hand-Drawn Scribble -->
      <h1 class="headline">
        Direct-Response <br>
        <span class="red-scribble-wrapper">
          DTC Creative Engine
          <svg class="red-scribble" viewBox="0 0 300 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12C60 6 150 4 295 14" stroke="currentColor" stroke-width="4.8" stroke-linecap="round"/>
          </svg>
        </span>
      </h1>

      <!-- Clean Doodle Row: Curly Arrow + Note + Sparkle -->
      <div class="doodle-row">
        <svg class="arrow-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M46 14C36 10 22 18 26 30C30 42 44 40 40 52M40 52L48 46M40 52L34 46" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="doodle-text-group">
          <span class="arrow-label">No Meeting Fatigue</span>
          <span class="doodle-sparkle">✦</span>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
