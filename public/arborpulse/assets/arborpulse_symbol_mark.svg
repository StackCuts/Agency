<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Circle -->
    <linearGradient id="symCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2E1F" />
      <stop offset="100%" stop-color="#04180F" />
    </linearGradient>

    <!-- MongoDB Authentic Leaf Gradients (ArborPulse Colors) -->
    <!-- Left Leaf Side -->
    <linearGradient id="leafLeftSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Right Leaf Side -->
    <linearGradient id="leafRightSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Central Leaf Spine / Stem -->
    <linearGradient id="leafStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>

    <!-- Pure Water Drop Gradient (Clean, Zero Dots, Zero Smile) -->
    <linearGradient id="pureWaterDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="pureDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Pulse Dashed Precision Ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.6" />
  
  <!-- Outer Gold Accent Ring -->
  <circle cx="60" cy="60" r="51" fill="none" stroke="#E5A93C" stroke-width="1" opacity="0.45" />

  <!-- MAIN SOLID PERFECT CIRCLE -->
  <circle cx="60" cy="60" r="46" fill="url(#symCircleGrad)" stroke="#1E7B4D" stroke-width="2" />

  <!-- AUTHENTIC MONGODB LEAF GEOMETRY (Centered & Scaled) -->
  <g transform="translate(60, 60) scale(2.2) translate(-16, -16)">
    <!-- Stem / Central Base -->
    <path d="M16.62,30l-.751-.249s.1-3.8-1.275-4.067c-.9-1.048.133-44.741,3.423-.149a2.712,2.712,0,0,0-1.333,1.523A14.1,14.1,0,0,0,16.62,30Z" fill="url(#leafStemGrad)" opacity="0.8" />
    <!-- Right Leaf Half -->
    <path d="M17.026,26.329a13.223,13.223,0,0,0,5-13.225C20.556,6.619,17.075,4.487,16.7,3.673a9.792,9.792,0,0,1-.825-1.6l.277,18.069S15.578,25.664,17.026,26.329Z" fill="url(#leafRightSide)" />
    <!-- Left Leaf Half -->
    <path d="M15.487,26.569S9.366,22.4,9.72,15.025A15.54,15.54,0,0,1,15.239,3.377,1.725,1.725,0,0,0,15.846,2c.381.82.319,12.243.359,13.579C16.36,20.776,15.916,25.588,15.487,26.569Z" fill="url(#leafLeftSide)" />
  </g>

  <!-- PURE MINIMALIST WATER DROP (Centered on Leaf) -->
  <path d="M 60 46 C 60 46, 67.5 56.5, 67.5 62 C 67.5 66.2, 64.1 69.5, 60 69.5 C 55.9 69.5, 52.5 66.2, 52.5 62 C 52.5 56.5, 60 46, 60 46 Z" fill="url(#pureWaterDrop)" filter="url(#pureDropShadow)" />
</svg>
