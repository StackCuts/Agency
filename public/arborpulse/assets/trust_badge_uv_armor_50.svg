<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sunBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="uvSolidBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E3D29" />
      <stop offset="100%" stop-color="#051B12" />
    </linearGradient>
    <filter id="uvGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Outer Ring (Centered at 90, 90) -->
  <circle cx="90" cy="90" r="86" fill="#F8FAF7" stroke="url(#sunBorder)" stroke-width="2.5" filter="url(#uvGlow)" />
  
  <!-- Solid Inner Circle (All content is strictly inside this circle) -->
  <circle cx="90" cy="90" r="78" fill="url(#uvSolidBg)" stroke="#1E7B4D" stroke-width="1.5" />
  
  <!-- Inner Decorative Dashed Sun Gold Inset -->
  <circle cx="90" cy="90" r="71" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- TOP ICON: Sun + 45°C Heat Armor (Centered at 90, 52 with perfect padding) -->
  <g transform="translate(90, 52)">
    <!-- Sun Ray Accents -->
    <path d="M 0 -22 L 0 -17 M 0 17 L 0 22 M -22 0 L -17 0 M 17 0 L 22 0 M -15 -15 L -11 -11 M 11 11 L 15 15 M -15 15 L -11 11 M 11 -11 L 15 -15" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
    <!-- Sun Center Body (Spacious & balanced) -->
    <circle cx="0" cy="0" r="13" fill="#B45309" stroke="#FDE68A" stroke-width="1.5" />
    <!-- 45°C Micro Text (Refined size with generous internal breathing margin) -->
    <text x="0" y="3" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="7.5" fill="#FFFFFF" letter-spacing="0.2">45°C</text>
  </g>

  <!-- Subtle Divider Line -->
  <line x1="55" y1="92" x2="125" y2="92" stroke="#F59E0B" stroke-width="1" opacity="0.5" />
  <polygon points="90,89 93,92 90,95 87,92" fill="#FDE68A" />

  <!-- TEXT (100% Inside Inner Circle) -->
  <!-- Line 1: Primary Claim -->
  <text x="90" y="109" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-weight="800" font-size="11.5" fill="#FDE68A" letter-spacing="0.6">UV-ARMOR 50+</text>
  
  <!-- Line 2: Secondary Specification -->
  <text x="90" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="8.5" fill="#FFFFFF" letter-spacing="1.2">HEATWAVE TESTED</text>

  <!-- 5 Gold Stars (Centered at 90, 138) -->
  <g transform="translate(90, 137)" fill="#F59E0B">
    <text font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">★ ★ ★ ★ ★</text>
  </g>
</svg>
