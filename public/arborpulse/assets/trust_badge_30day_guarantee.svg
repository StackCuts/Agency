<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="solidBadgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E3D29" />
      <stop offset="100%" stop-color="#051B12" />
    </linearGradient>
    <filter id="badgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Outer Ring (Centered at 90, 90) -->
  <circle cx="90" cy="90" r="86" fill="#F8FAF7" stroke="url(#goldBorder)" stroke-width="2.5" filter="url(#badgeGlow)" />
  
  <!-- Solid Inner Circle (All content is strictly inside this circle) -->
  <circle cx="90" cy="90" r="78" fill="url(#solidBadgeBg)" stroke="#1E7B4D" stroke-width="1.5" />
  
  <!-- Inner Decorative Dashed Gold Inset -->
  <circle cx="90" cy="90" r="71" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- TOP ICON: 30-Day Root Shield (Centered at 90, 52) -->
  <g transform="translate(90, 52)">
    <!-- Shield Outline -->
    <path d="M 0 -18 L 18 -10 C 18 10, 10 24, 0 30 C -10 24, -18 10, -18 -10 Z" fill="rgba(34, 197, 94, 0.15)" stroke="url(#goldBorder)" stroke-width="2" />
    <!-- Checkmark -->
    <path d="M -6 5 L -1 10 L 8 -1" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Subtle Divider Line -->
  <line x1="55" y1="92" x2="125" y2="92" stroke="#F59E0B" stroke-width="1" opacity="0.5" />
  <polygon points="90,89 93,92 90,95 87,92" fill="#FDE68A" />

  <!-- TEXT (100% Inside Inner Circle) -->
  <!-- Line 1: Primary Claim -->
  <text x="90" y="109" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-weight="800" font-size="11.5" fill="#FDE68A" letter-spacing="0.6">30-DAY GUARANTEE</text>
  
  <!-- Line 2: Secondary Specification -->
  <text x="90" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="8.5" fill="#FFFFFF" letter-spacing="1.2">ROOT SURVIVAL</text>

  <!-- 5 Gold Stars (Centered at 90, 138) -->
  <g transform="translate(90, 137)" fill="#F59E0B">
    <text font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">★ ★ ★ ★ ★</text>
  </g>
</svg>
