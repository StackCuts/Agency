<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="solidCircleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>

    <!-- MongoDB Authentic Leaf Gradients -->
    <linearGradient id="leafDarkLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="leafDarkRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="leafDarkStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>

    <!-- Pure Minimalist Drop Gradient (No smile, No dots) -->
    <linearGradient id="pureDropDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="darkDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ICON: 100% Perfectly Symmetrical Geometrical Circle -->
  <g transform="translate(12, 12)">
    <!-- Outer Precision Dashed Pulse Ring -->
    <circle cx="28" cy="28" r="27" fill="none" stroke="#4ADE80" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75" />
    
    <!-- INNER SOLID PERFECT CIRCLE -->
    <circle cx="28" cy="28" r="23" fill="url(#solidCircleDark)" stroke="#4ADE80" stroke-width="1.2" />
    
    <!-- AUTHENTIC MONGODB LEAF GEOMETRY (Centered at 28,28) -->
    <g transform="translate(28, 28) scale(1.1) translate(-16, -16)">
      <!-- Stem -->
      <path d="M16.62,30l-.751-.249s.1-3.8-1.275-4.067c-.9-1.048.133-44.741,3.423-.149a2.712,2.712,0,0,0-1.333,1.523A14.1,14.1,0,0,0,16.62,30Z" fill="url(#leafDarkStem)" opacity="0.8" />
      <!-- Right Leaf Half -->
      <path d="M17.026,26.329a13.223,13.223,0,0,0,5-13.225C20.556,6.619,17.075,4.487,16.7,3.673a9.792,9.792,0,0,1-.825-1.6l.277,18.069S15.578,25.664,17.026,26.329Z" fill="url(#leafDarkRight)" />
      <!-- Left Leaf Half -->
      <path d="M15.487,26.569S9.366,22.4,9.72,15.025A15.54,15.54,0,0,1,15.239,3.377,1.725,1.725,0,0,0,15.846,2c.381.82.319,12.243.359,13.579C16.36,20.776,15.916,25.588,15.487,26.569Z" fill="url(#leafDarkLeft)" />
    </g>
    
    <!-- PURE WATER DROPLET (Centered, Clean, No smile, No dot) -->
    <path d="M 28 21 C 28 21, 31.8 26.5, 31.8 29.2 C 31.8 31.4, 30.1 33, 28 33 C 25.9 33, 24.2 31.4, 24.2 29.2 C 24.2 26.5, 28 21, 28 21 Z" fill="url(#pureDropDark)" filter="url(#darkDropShadow)" />
  </g>

  <!-- WORDMARK: ArborPulse™ + Tagline -->
  <g transform="translate(82, 47)">
    <text font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF" letter-spacing="-0.6">Arbor<tspan fill="#4ADE80" font-weight="600">Pulse</tspan></text>
    <!-- Trademark Badge -->
    <text x="184" y="-14" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="10" fill="#FBBF24">TM</text>
    <!-- Sub-Brand Tracking Microcopy -->
    <text x="2" y="16" font-family="JetBrains Mono, Inter, monospace" font-weight="700" font-size="8" fill="#9CA3AF" letter-spacing="2.4">PRECISION TREE HYDRATION</text>
  </g>
</svg>
