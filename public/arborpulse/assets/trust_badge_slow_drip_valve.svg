<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="blueBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="dripSolidBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E3D29" />
      <stop offset="100%" stop-color="#051B12" />
    </linearGradient>
    <filter id="dripGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Outer Ring (Centered at 90, 90) -->
  <circle cx="90" cy="90" r="86" fill="#F8FAF7" stroke="url(#blueBorder)" stroke-width="2.5" filter="url(#dripGlow)" />
  
  <!-- Solid Inner Circle (All content is strictly inside this circle) -->
  <circle cx="90" cy="90" r="78" fill="url(#dripSolidBg)" stroke="#1E7B4D" stroke-width="1.5" />
  
  <!-- Inner Decorative Dashed Sky Blue Inset -->
  <circle cx="90" cy="90" r="71" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- TOP ICON: 5-8h Clock + Precision Water Drop (Centered at 90, 52) -->
  <g transform="translate(90, 52)">
    <!-- Clock Outer -->
    <circle cx="0" cy="-4" r="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.8" />
    <!-- Clock Hands (Pointing ~5 to 8) -->
    <path d="M 0 -10 L 0 -4 L 6 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <!-- Micro Water Drop -->
    <path d="M 0 14 C 0 14, 5 21, 5 24 C 5 26.8, 2.8 29, 0 29 C -2.8 29, -5 26.8, -5 24 C -5 21, 0 14, 0 14 Z" fill="#38BDF8" />
  </g>

  <!-- Subtle Divider Line -->
  <line x1="55" y1="92" x2="125" y2="92" stroke="#38BDF8" stroke-width="1" opacity="0.5" />
  <polygon points="90,89 93,92 90,95 87,92" fill="#BAE6FD" />

  <!-- TEXT (100% Inside Inner Circle) -->
  <!-- Line 1: Primary Claim -->
  <text x="90" y="109" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-weight="800" font-size="11.5" fill="#BAE6FD" letter-spacing="0.6">5-8 HR SLOW DRIP</text>
  
  <!-- Line 2: Secondary Specification -->
  <text x="90" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="8.5" fill="#FFFFFF" letter-spacing="1.2">DEEP ROOT SOAK</text>

  <!-- 5 Blue/Gold Stars (Centered at 90, 138) -->
  <g transform="translate(90, 137)" fill="#38BDF8">
    <text font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">★ ★ ★ ★ ★</text>
  </g>
</svg>
