<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArborPulse™ - Carousel 01 Interactive Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background-color: #020B06;
    color: #F8FAFC;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  header {
    text-align: center;
    margin-bottom: 30px;
  }
  .tag {
    display: inline-block;
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.3);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #FFFFFF;
    letter-spacing: -0.8px;
    margin-bottom: 8px;
  }
  p.subtitle {
    color: #94A3B8;
    font-size: 16px;
    max-width: 600px;
    margin: 0 auto;
  }
  
  /* Carousel Container */
  .carousel-viewport {
    width: 480px;
    height: 600px;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(34, 197, 94, 0.25);
    background: #03140C;
  }
  .carousel-track {
    display: flex;
    width: 700%;
    height: 100%;
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .slide-frame {
    width: 480px;
    height: 600px;
    flex-shrink: 0;
    position: relative;
  }
  .slide-frame iframe {
    width: 1080px;
    height: 1350px;
    border: none;
    transform: scale(0.444444);
    transform-origin: top left;
    pointer-events: none;
  }
  
  /* Navigation Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 24px;
  }
  .nav-btn {
    background: rgba(4, 25, 15, 0.9);
    border: 1px solid rgba(34, 197, 94, 0.4);
    color: #FFFFFF;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn:hover {
    background: #22C55E;
    color: #03140C;
    transform: scale(1.08);
  }
  .indicator-dots {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    cursor: pointer;
    transition: all 0.3s;
  }
  .dot.active {
    width: 28px;
    border-radius: 999px;
    background: #22C55E;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
  }
  
  /* Thumbnails strip below */
  .thumbnail-strip {
    display: flex;
    gap: 12px;
    margin-top: 36px;
    overflow-x: auto;
    max-width: 900px;
    padding: 10px;
  }
  .thumb {
    width: 100px;
    height: 125px;
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    position: relative;
  }
  .thumb:hover, .thumb.active {
    border-color: #22C55E;
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
  }
  .thumb iframe {
    width: 1080px;
    height: 1350px;
    border: none;
    transform: scale(0.09259);
    transform-origin: top left;
    pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <div class="tag">Showcase 01 • Carousel Ad 01</div>
  <h1>The 45°C Heatwave Tragedy (Cinematic Storyteller)</h1>
  <p class="subtitle">7-Slide Mobile 4:5 Narrative Arc based on Rajeev Mehta & DesignShala framework.</p>
</header>

<div class="carousel-viewport">
  <div class="carousel-track" id="track">
    <div class="slide-frame"><iframe src="slide_01.html"></iframe></div>
    <div class="slide-frame"><iframe src="slide_02.html"></iframe></div>
    <div class="slide-frame"><iframe src="slide_03.html"></iframe></div>
    <div class="slide-frame"><iframe src="slide_04.html"></iframe></div>
    <div class="slide-frame"><iframe src="slide_05.html"></iframe></div>
    <div class="slide-frame"><iframe src="slide_06.html"></iframe></div>
    <div class="slide-frame"><iframe src="slide_07.html"></iframe></div>
  </div>
</div>

<div class="controls">
  <button class="nav-btn" id="prevBtn" onclick="prevSlide()">◀</button>
  <div class="indicator-dots" id="dots">
    <div class="dot active" onclick="goToSlide(0)"></div>
    <div class="dot" onclick="goToSlide(1)"></div>
    <div class="dot" onclick="goToSlide(2)"></div>
    <div class="dot" onclick="goToSlide(3)"></div>
    <div class="dot" onclick="goToSlide(4)"></div>
    <div class="dot" onclick="goToSlide(5)"></div>
    <div class="dot" onclick="goToSlide(6)"></div>
  </div>
  <button class="nav-btn" id="nextBtn" onclick="nextSlide()">▶</button>
</div>

<div class="thumbnail-strip">
  <div class="thumb active" onclick="goToSlide(0)"><iframe src="slide_01.html"></iframe></div>
  <div class="thumb" onclick="goToSlide(1)"><iframe src="slide_02.html"></iframe></div>
  <div class="thumb" onclick="goToSlide(2)"><iframe src="slide_03.html"></iframe></div>
  <div class="thumb" onclick="goToSlide(3)"><iframe src="slide_04.html"></iframe></div>
  <div class="thumb" onclick="goToSlide(4)"><iframe src="slide_05.html"></iframe></div>
  <div class="thumb" onclick="goToSlide(5)"><iframe src="slide_06.html"></iframe></div>
  <div class="thumb" onclick="goToSlide(6)"><iframe src="slide_07.html"></iframe></div>
</div>

<script>
  let currentSlide = 0;
  const totalSlides = 7;
  const track = document.getElementById('track');
  const dots = document.querySelectorAll('.indicator-dots .dot');
  const thumbs = document.querySelectorAll('.thumbnail-strip .thumb');

  function updateCarousel() {
    track.style.transform = `translateX(-${currentSlide * 480}px)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    thumbs.forEach((t, i) => t.classList.toggle('active', i === currentSlide));
  }

  function nextSlide() {
    currentSlide = (currentSlide + 1) % totalSlides;
    updateCarousel();
  }

  function prevSlide() {
    currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
    updateCarousel();
  }

  function goToSlide(index) {
    currentSlide = index;
    updateCarousel();
  }

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });
</script>

</body>
</html>
